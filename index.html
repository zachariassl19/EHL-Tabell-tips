<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111d">
<title>EHL Familietips 2026/27</title>
<style>
*{box-sizing:border-box}:root{--bg:#07101d;--card:#121827;--line:#29364d;--text:#f7f8fb;--muted:#aeb8ca;--accent:#ff7900;--green:#53de94;--red:#ff7f8d}
html,body{margin:0;min-height:100%;background:linear-gradient(#0d1728,#060a12);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:820px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center}.ey{color:var(--accent);font-size:11px;font-weight:900;letter-spacing:.15em;text-transform:uppercase}h1{margin:0 0 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}.muted,p{color:var(--muted);line-height:1.45}.hidden{display:none!important}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.tab,.ghost{padding:10px 12px;border-radius:11px;background:#151f31;color:#fff;border:1px solid var(--line);font-weight:800}.tab.on,.primary{background:var(--accent);color:#111;border-color:var(--accent)}.primary{width:100%;padding:13px;border:0;border-radius:11px;font-weight:900;margin-top:12px}input,select{width:100%;padding:12px;border-radius:11px;border:1px solid #35445f;background:#0d1422;color:#fff;margin-top:7px;font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}.grid label{font-size:13px;font-weight:800}.ranking{display:flex;flex-direction:column;gap:7px;margin-top:12px}.rank{display:grid;grid-template-columns:34px 1fr 46px;gap:8px;align-items:center;padding:9px;background:#0c1321;border:1px solid #2a3851;border-radius:12px}.num{color:var(--accent);font-weight:950}.ctl{display:flex;flex-direction:column;gap:2px}.ctl button{background:#22304a;color:#fff;border:0;border-radius:7px}.selrow{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center}.lb{display:grid;grid-template-columns:40px 1fr auto;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.pos{color:var(--accent);font-size:20px;font-weight:950}.pts{font-size:20px;font-weight:950}.sub{font-size:12px;color:var(--muted)}.err{color:var(--red)}.status{color:var(--green);font-weight:800;text-align:center}.deadline{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{font-weight:900;font-size:12px}.br{display:grid;grid-template-columns:180px 180px 180px;gap:9px;overflow:auto}.match{background:#0d1422;border:1px solid #2a3851;padding:9px;border-radius:10px;margin-bottom:7px}.rule{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}.rule b{color:var(--accent)}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.head select{max-width:190px;margin:0}@media(max-width:600px){.wrap{padding:10px}.grid{grid-template-columns:1fr}.head{flex-direction:column}.head select{max-width:none}}
</style>
</head>
<body><div class="wrap">
<header class="top"><div><div class="ey">EHL 2026/27</div><h1>Familietips</h1></div><button id="logout" class="ghost hidden">Logg ut</button></header>
<section id="login" class="card"><h2>Logg inn</h2><p>Første gang velger du navnet ditt og lager en 6-sifret PIN.</p><select id="who"><option value="alexander">Alexander</option><option value="malin">Malin</option><option value="erik">Erik</option><option value="zacharias">Zacharias</option><option value="nathaniel">Nathaniel</option></select><input id="pin" inputmode="numeric" maxlength="6" placeholder="6-sifret PIN"><button id="loginBtn" class="primary">Logg inn</button><div id="err" class="err"></div></section>
<section id="app" class="hidden"><div class="card deadline"><div><div class="ey">Tipsfrist</div><div id="deadline"></div></div><div id="badge" class="badge"></div></div>
<nav class="tabs"><button class="tab on" data-view="tips">Mine tips</button><button class="tab" data-view="nm">NM</button><button class="tab" data-view="leaderboard">Leaderboard</button><button class="tab" data-view="rules">Poeng</button><button id="adminTab" class="tab hidden" data-view="admin">Admin</button></nav>
<section id="tipsView" class="view"><div class="card"><div class="head"><div><h2>Tabelltips</h2><p>Flytt lagene, eller velg plassering fra liste.</p></div><select id="rankMode"><option value="move">Flytt opp/ned</option><option value="select">Velg fra liste</option></select></div><div id="ranking" class="ranking"></div><div id="selectRanking" class="ranking hidden"></div></div><div class="card grid"><label>Første trener som ryker<input id="coach" list="coaches" placeholder="Søk trener"></label><label>Poengkonge grunnserie<input id="points" list="players" placeholder="Søk spiller"></label><label>Verste ny-signering<input id="worst" list="newSignings" placeholder="Søk blant nye signeringer"></label></div><button id="save" class="primary">Lagre tips</button><div id="msg" class="status"></div></section>
<section id="nmView" class="view hidden"><div class="card"><h2>NM</h2><p>Topp 8 går videre. Kvartfinalevalgene kan justeres senere når vi vet hvem som velger hvem.</p><div id="bracket" class="br"></div></div><div class="card grid"><label>Norgesmester<select id="champ"></select></label><label>Poengkonge sluttspill<input id="pp" list="players" placeholder="Søk spiller"></label><label>Sluttspill-MVP<input id="mvp" list="players" placeholder="Søk spiller"></label></div><button id="saveNm" class="primary">Lagre NM-tips</button></section>
<section id="leaderboardView" class="view hidden"><div class="card"><h2>Leaderboard</h2><div id="lb"></div></div></section>
<section id="rulesView" class="view hidden"><div class="card"><h2>Poeng</h2><div id="rules"></div></div></section>
<section id="adminView" class="view hidden"><div class="card"><h2>Admin-fasit</h2><div id="actualRanking" class="ranking"></div></div><div class="card grid"><label>Første trener som røk<input id="aCoach" list="coaches"></label><label>Poengkonge grunnserie<input id="aPoints" list="players"></label><label>Verste ny-signering<input id="aWorst" list="newSignings"></label><label>Norgesmester<select id="aChamp"></select></label><label>Poengkonge sluttspill<input id="aPP" list="players"></label><label>Sluttspill-MVP<input id="aMvp" list="players"></label></div><button id="saveActual" class="primary">Lagre fasit</button><div id="adminMsg" class="status"></div></section>
</section>
<datalist id="players"></datalist><datalist id="coaches"></datalist><datalist id="newSignings"></datalist>
<script>
const API='https://bioqeczhqedlhbvprxci.supabase.co/functions/v1/ehl-family-api';
const $=s=>document.querySelector(s);let token=localStorage.ehlToken||'',D=null,order=[],actual=[];
async function call(action,p={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-session-token':token},body:JSON.stringify({action,...p})});const x=await r.json();if(!r.ok)throw Error(x.error||'Feil');return x}
function locked(){return D&&Date.now()>new Date(D.settings.deadline).getTime()}
async function login(){const pin=$('#pin').value.trim();if(!/^\d{6}$/.test(pin)){ $('#err').textContent='PIN må være 6 sifre';return}try{const x=await call('login',{slug:$('#who').value,pin});token=x.token;localStorage.ehlToken=token;await load()}catch(e){$('#err').textContent=e.message}}
async function load(){D=await call('bootstrap');$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#logout').classList.remove('hidden');$('#adminTab').classList.toggle('hidden',!D.user.is_admin);$('#deadline').textContent=new Intl.DateTimeFormat('nb-NO',{dateStyle:'medium',timeStyle:'short',timeZone:'Europe/Oslo'}).format(new Date(D.settings.deadline));$('#badge').textContent=locked()?'LÅST':'ÅPEN';order=D.tip?.table_tip?.length===D.teams.length?[...D.tip.table_tip]:[...D.teams];actual=D.actual?.table_actual?.length===D.teams.length?[...D.actual.table_actual]:[...D.teams];fill();renderRanking();renderBracket();renderLb();renderRules();if(D.user.is_admin)renderActual()}
function fill(){for(const x of D.people||[]){const text=x.name+' — '+x.team;if(x.kind==='coach')$('#coaches').append(new Option(text));else $('#players').append(new Option(text));if(x.kind==='player'&&x.is_new_signing)$('#newSignings').append(new Option(text))}for(const id of ['champ','aChamp']){const e=$('#'+id);e.innerHTML='<option value="">Velg lag</option>';D.teams.forEach(t=>e.add(new Option(t,t)))}const t=D.tip||{};$('#coach').value=t.coach_pick||'';$('#points').value=t.points_pick||'';$('#worst').value=t.worst_pick||'';$('#champ').value=t.champion_pick||'';$('#pp').value=t.playoff_points_pick||'';$('#mvp').value=t.mvp_pick||'';if(D.actual){$('#aCoach').value=D.actual.coach||'';$('#aPoints').value=D.actual.points||'';$('#aWorst').value=D.actual.worst||'';$('#aChamp').value=D.actual.champion||'';$('#aPP').value=D.actual.playoff_points||'';$('#aMvp').value=D.actual.mvp||''}}
function renderRanking(){const mode=$('#rankMode').value;$('#ranking').classList.toggle('hidden',mode!=='move');$('#selectRanking').classList.toggle('hidden',mode!=='select');if(mode==='move'){const c=$('#ranking');c.innerHTML='';order.forEach((team,i)=>{const r=document.createElement('div');r.className='rank';r.draggable=!locked();r.innerHTML='<div class="num">'+(i+1)+'</div><b>'+team+'</b><div class="ctl"><button>▲</button><button>▼</button></div>';r.ondragstart=e=>e.dataTransfer.setData('text/plain',i);r.ondragover=e=>e.preventDefault();r.ondrop=e=>{e.preventDefault();const from=+e.dataTransfer.getData('text/plain');const [x]=order.splice(from,1);order.splice(i,0,x);renderRanking();renderBracket()};const b=r.querySelectorAll('button');b[0].disabled=locked()||i===0;b[1].disabled=locked()||i===order.length-1;b[0].onclick=()=>{[order[i-1],order[i]]=[order[i],order[i-1]];renderRanking();renderBracket()};b[1].onclick=()=>{[order[i+1],order[i]]=[order[i],order[i+1]];renderRanking();renderBracket()};c.append(r)})}else{const c=$('#selectRanking');c.innerHTML='';order.forEach((team,i)=>{const r=document.createElement('div');r.className='selrow';r.innerHTML='<div class="num">'+(i+1)+'</div>';const s=document.createElement('select');D.teams.forEach(t=>{const o=new Option(t,t);o.selected=t===team;o.disabled=order.includes(t)&&t!==team;s.add(o)});s.disabled=locked();s.onchange=()=>{const newTeam=s.value,old=order[i],j=order.indexOf(newTeam);if(j>=0&&j!==i)order[j]=old;order[i]=newTeam;renderRanking();renderBracket()};r.append(s);c.append(r)})}}
function renderBracket(){const top=order.slice(0,8);$('#bracket').innerHTML='<div><h4>Topp 8</h4>'+top.map((x,i)=>'<div class="match">'+(i+1)+'. '+x+'</div>').join('')+'</div><div><h4>Kvartfinaler</h4>'+Array(4).fill('<div class="match">Valg senere</div>').join('')+'</div><div><h4>Videre</h4><div class="match">Semifinaler</div><div class="match">NM-finale</div><div class="match">🏆 '+($('#champ').value||'Din vinner')+'</div></div>'}
async function saveTips(){try{await call('save_tips',{tip:{table_tip:order,coach_pick:$('#coach').value,points_pick:$('#points').value,worst_pick:$('#worst').value,champion_pick:$('#champ').value,playoff_points_pick:$('#pp').value,mvp_pick:$('#mvp').value}});$('#msg').textContent='Lagret ✓';D=await call('bootstrap');renderLb()}catch(e){$('#msg').textContent=e.message}}
function renderLb(){$('#lb').innerHTML=(D.leaderboard||[]).map((x,i)=>'<div class="lb"><div class="pos">'+(i+1)+'</div><div><b>'+x.name+'</b><div class="sub">'+(x.submitted?'Tips levert':'Ikke levert')+'</div></div><div class="pts">'+x.points+' p</div></div>').join('')}
function renderRules(){const s=D.scoring,a=[['Riktig tabellplass',s.exact],['Én plass unna',s.oneOff],['Lag riktig i topp 3','+'+s.top3],['Perfekt topp 3','+'+s.perfectTop3],['Riktig seriemester','+'+s.champBonus],['Første trener som ryker',s.coach],['Poengkonge grunnserie',s.points],['Verste ny-signering',s.worst],['Norgesmester',s.nm],['Poengkonge sluttspill',s.playoffPoints],['Sluttspill-MVP',s.mvp]];$('#rules').innerHTML=a.map(x=>'<div class="rule"><span>'+x[0]+'</span><b>'+x[1]+' p</b></div>').join('')}
function renderActual(){const c=$('#actualRanking');c.innerHTML='';actual.forEach((team,i)=>{const r=document.createElement('div');r.className='rank';r.innerHTML='<div class="num">'+(i+1)+'</div><b>'+team+'</b><div class="ctl"><button>▲</button><button>▼</button></div>';const b=r.querySelectorAll('button');b[0].disabled=i===0;b[1].disabled=i===actual.length-1;b[0].onclick=()=>{[actual[i-1],actual[i]]=[actual[i],actual[i-1]];renderActual()};b[1].onclick=()=>{[actual[i+1],actual[i]]=[actual[i],actual[i+1]];renderActual()};c.append(r)})}
async function saveActual(){try{await call('save_actual',{actual:{table_actual:actual,coach:$('#aCoach').value,points:$('#aPoints').value,worst:$('#aWorst').value,champion:$('#aChamp').value,playoff_points:$('#aPP').value,mvp:$('#aMvp').value}});$('#adminMsg').textContent='Fasit lagret ✓';D=await call('bootstrap');renderLb()}catch(e){$('#adminMsg').textContent=e.message}}
$('#loginBtn').onclick=login;$('#logout').onclick=()=>{localStorage.removeItem('ehlToken');location.reload()};$('#rankMode').onchange=renderRanking;$('#save').onclick=saveTips;$('#saveNm').onclick=saveTips;$('#champ').onchange=renderBracket;$('#saveActual').onclick=saveActual;document.querySelector('.tabs').onclick=e=>{const v=e.target.dataset.view;if(!v)return;document.querySelectorAll('.view').forEach(x=>x.classList.add('hidden'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));$('#'+v+'View').classList.remove('hidden');e.target.classList.add('on')};if(token)load().catch(()=>{localStorage.removeItem('ehlToken');token=''})
</script></div></body></html>
